models:
  - name: stg_spotify__plays
    columns:
      - name: play_id
        data_tests:
          - not_null
          - unique
      - name: track_id
        data_tests:
          - not_null
      - name: played_at_utc
        data_tests:
          - not_null
      - name: played_at_local
        data_tests:
          - not_null

  - name: stg_spotify__album_artists
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - album_id
              - artist_id
    columns:
      - name: album_id
        data_tests:
          - not_null
      - name: artist_id
        data_tests:
          - not_null
  - name: stg_spotify_track_artists
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - track_id
              - artist_id

    columns:
      - name: track_id
        data_tests:
          - not_null
      - name: artist_id
        data_tests:
          - not_null

