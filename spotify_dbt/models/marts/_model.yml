version: 2

models:
  - name: dim_artist
    columns:
      - name: artist_id
        data_tests:
          - unique
          - not_null
      - name: artist_name
        data_tests:
          - not_null

  - name: dim_album
    columns:
      - name: album_id
        data_tests:
          - unique
          - not_null
      - name: album_name
        data_tests:
          - not_null

  - name: dim_track
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - album_id
              - track_id
    columns:
      - name: track_id
        data_tests:
          - not_null
          - unique

      - name: track_name
        data_tests:
          - not_null

      - name: duration_ms
        data_tests:
          - not_null

  - name: bridge_artist_track
    columns:
      - name: track_artist_id
        data_tests:
          - unique
          - not_null

      - name: track_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_track')
                field: track_id

      - name: artist_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_artist')
                field: artist_id

  - name: bridge_artist_album
    columns:
      - name: album_artist_id
        data_tests:
          - unique
          - not_null

      - name: album_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_album')
                field: album_id

      - name: artist_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_artist')
                field: artist_id

  - name: fct_plays
    columns:
      - name: track_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_track')
                field: track_id

      - name: album_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_album')
                field: album_id

      - name: main_artist_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_artist')
                field: artist_id

      - name: played_at_local
        data_tests:
          - not_null

      - name: played_at_utc
        data_tests:
          - not_null

      - name: play_date_local
        data_tests:
          - not_null

      - name: partition_date
        data_tests:
          - not_null

      - name: duration_ms
        data_tests:
          - not_null

      - name: play_id
        data_tests:
          - unique
          - not_null