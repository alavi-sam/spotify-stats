version: 2

seeds:
  - name: excluded_tracks
    description: >
      Tracks removed from the whole warehouse (e.g. sleep or white noise played
      on loop). The Spotify staging models filter them out, so they never reach
      fct_plays, the dims, the bridges or the reporting tables. The raw JSON in
      S3 is untouched. After adding a row, full-refresh fct_plays.
    config:
      column_types:
        track_id: varchar
        track_name: varchar
        reason: varchar
    columns:
      - name: track_id
        description: Spotify track ID to exclude.
        data_tests:
          - unique
          - not_null
      - name: track_name
        description: Track title, for readability only.
      - name: reason
        description: Why the track is excluded.
